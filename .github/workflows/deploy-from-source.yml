name: Deploy website from source

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: website-deployment
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hosting repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out website source
        uses: actions/checkout@v4
        with:
          repository: timohaber/website
          ref: main
          path: source

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.111.3"
          extended: true

      - name: Build website
        run: hugo --source source --destination "$GITHUB_WORKSPACE/built"

      - name: Update generated website
        run: |
          rsync -a \
            --exclude=.git/ \
            --exclude=.github/ \
            built/ site/

      - name: Publish changed files
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "Deploy website from source"
          git push
